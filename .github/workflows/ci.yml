name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: fetch IPAdic
        run: ./scripts/fetch-ipadic.sh
      - name: build IPAdic binary
        run: cargo run -p jamo-cli --release -- dict build -o data/ipadic.dict
      - name: test
        run: cargo test

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build jamo-ime
        run: cargo build --release -p jamo-ime
      - name: smoke jamo-ime
        shell: pwsh
        run: ./scripts/ime-smoke.ps1 -Register
      - name: test jamo-core
        run: cargo test -p jamo-core
      - name: test jamo-ime
        run: cargo test -p jamo-ime
