[package]
name = "jamo-core"
version = "0.2.0"
edition = "2024"
description = "Kana-Kanji conversion engine with LOUDS trie and Viterbi decoder"
license = "MIT"
repository = "https://github.com/neguse/jamo"
keywords = ["japanese", "ime", "kana-kanji", "conversion"]
categories = ["text-processing"]

[features]
wasm = ["wasm-bindgen", "serde", "serde_json"]
ipc = ["serde", "serde_json"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "convert_bench"
harness = false
